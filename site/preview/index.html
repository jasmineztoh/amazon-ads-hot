<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light"><title>内容试读 · Amazon营销与AI</title>
  <link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script>
</head>
<body>
  <header class="masthead"><a href="/" class="wordmark">内容试读<span class="dot">●</span></a><span class="edition">AMAZON · 营销 · AI</span></header>
  <main>
    <section class="intro"><p class="eyebrow">找到值得读的内容</p><h1>懂变化，也学方法。</h1><p>广告、营销、流量与 AI，把有用的消息和经验放在一起。</p><div class="collection-note">48 篇已收录内容 <span>·</span> 本轮整理于 2026.10.29</div></section>
    <section aria-labelledby="feed-title" class="feed">
      <div class="section-heading"><h2 id="feed-title">精选</h2><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜关键词、来源" aria-label="搜索内容"></label></div>
      <nav id="filters" aria-label="内容栏目"></nav>
      <div class="list-toolbar"><p id="result-count" role="status" aria-live="polite">正在读取内容…</p><label>排序 <select id="sort" aria-label="排序"><option value="recommended">推荐顺序</option><option value="date">原文时间</option></select></label></div>
      <div id="articles" aria-live="off"></div><button id="more" class="more" hidden>再看 12 条</button>
      <noscript>请启用浏览器的 JavaScript 查看内容列表。</noscript>
    </section>
  </main>
  <footer>内容与顺序用于试读，原文时间见每条，尚未自动更新。</footer>
</body>
</html>
