<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light"><title>亚马逊广告投放</title>
  <link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script>
</head>
<body>
  <header class="masthead"><a href="/" class="wordmark">亚马逊广告投放<span class="dot">●</span></a><span class="edition">AMAZON ADS · FIELD NOTES</span></header>
  <main>
    <section class="intro"><p class="eyebrow">FOR EVERY AMAZON ADVERTISER</p><h1>让每一次投放，都有据可依。</h1><p class="slogan">Read the change. Learn the craft. Make every ad count.</p><p>给正在做、也准备开始做亚马逊广告投放的人。追踪新变化，学会方法，看懂真实案例。</p><div class="collection-note" id="collection-note">正在读取收录内容…</div></section>
    <section aria-labelledby="feed-title" class="feed">
      <div class="section-heading"><h2 id="feed-title">精选</h2><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜关键词、来源" aria-label="搜索内容"></label></div>
      <nav id="filters" aria-label="内容栏目"></nav>
      <section id="hot-section" class="hot-section" aria-labelledby="hot-title" hidden>
        <div class="hot-heading"><div><p class="hot-eyebrow">正在关注</p><h3 id="hot-title">热点</h3></div><p id="hot-note">根据已核实的精选内容更新</p></div>
        <div id="hot-items" class="hot-items"></div>
      </section>
      <nav id="tutorial-filters" aria-label="教程主题" hidden></nav>
      <div class="list-toolbar"><p id="result-count" role="status" aria-live="polite">正在读取内容…</p><div class="list-controls"><button type="button" id="saved-filter" aria-pressed="false">只看收藏</button><label>排序 <select id="sort" aria-label="排序"><option value="collected">收录时间</option><option value="recommended">推荐顺序</option><option value="date">原文时间</option></select></label></div></div>
      <div id="guide-heading" class="guide-heading" hidden><div><strong>从问题开始</strong><span>挑一个问题，按顺序读</span></div><button id="next-guides" type="button" aria-label="换一组推荐问题">换一组 ↻</button></div>
      <div id="guides"></div>
      <div id="articles" aria-live="off"></div><button id="more" class="more" hidden>再看 12 条</button>
      <noscript>请启用浏览器的 JavaScript 查看内容列表。</noscript>
    </section>
    <section id="detail" class="feed" hidden aria-live="polite"></section>
  </main>
  <footer><span id="update-note">原文时间见每条。</span> <a id="manage-signin" href="/signin-with-chatgpt?return_to=%2F" target="_top" hidden>管理登录</a></footer>
</body>
</html>
